<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f6fe" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Lumen" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Lumen — scan a receipt, get every item and price in date order, and ask Beam to find anything in it. Private, on-device receipt intelligence by Mihir Gupta." />
    <title>Lumen — Receipt Intelligence</title>
    <script>
      // Paint the saved theme before the app loads so a dark-theme user never
      // sees a light flash. Kept in sync with localStorage by ThemeSweep.
      (function () {
        try {
          var t = localStorage.getItem('lumen-theme');
          if (t !== 'light' && t !== 'dark') t = 'light';
          document.documentElement.dataset.theme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#f2f6fe' : '#050914');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
