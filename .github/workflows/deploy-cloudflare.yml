# ---------------------------------------------------------------------------
# GitHub Pages hosting is already set up (.github/workflows/deploy-pages.yml)
# and deploys to https://vortexmc0606-hub.github.io/Receipt-counter/ for free.
#
# These workflows are OPTIONAL alternatives. To turn one on, uncomment the
# `push:` trigger below and add the listed repository secret(s) in
# Settings → Secrets and variables → Actions. Until then they only run when you
# click "Run workflow" in the Actions tab.
# ---------------------------------------------------------------------------

name: Deploy to Cloudflare Pages (free)

on:
  workflow_dispatch:
  # push:
  #   branches: ["main"]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          VITE_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          VITE_LLM_MODEL: ${{ secrets.LLM_MODEL }}
          VITE_VISION_MODEL: ${{ secrets.VISION_MODEL }}
          VITE_AI_READING: "true"
          VITE_API_BASE_URL: ${{ secrets.BACKEND_URL }}
          VITE_BACKEND_SYNC: ${{ secrets.BACKEND_SYNC }}
      # SPA fallback for a static host that has no rewrite rules.
      - run: cp dist/index.html dist/404.html
      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lumen
